[pytest]
# Tells pytest where to look, without needing "pytest tests/" typed
# out every time -- plain "pytest" from the project root is enough.
testpaths = tests

# pytest can discover and run unittest.TestCase classes natively (no
# plugin needed) -- these patterns match the existing test_*.py files
# and Test* classes already used throughout tests/.
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = -v
